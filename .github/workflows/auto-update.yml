name: Auto-update formula

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PyPI for latest version
        id: check
        run: |
          CURRENT=$(grep -oP 'youngcan_wyckoff_analysis-\K[0-9.]+' Formula/wyckoff.rb | head -1)
          LATEST=$(curl -s https://pypi.org/pypi/youngcan-wyckoff-analysis/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update formula
        if: steps.check.outputs.needs_update == 'true'
        run: |
          VERSION="${{ steps.check.outputs.latest }}"
          URL="https://files.pythonhosted.org/packages/source/y/youngcan-wyckoff-analysis/youngcan_wyckoff_analysis-${VERSION}.tar.gz"
          SHA256=$(curl -sL "$URL" | shasum -a 256 | cut -d' ' -f1)
          sed -i "s|url \".*\"|url \"${URL}\"|" Formula/wyckoff.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/wyckoff.rb

      - name: Commit and push
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/wyckoff.rb
          git commit -m "bump wyckoff to ${{ steps.check.outputs.latest }}"
          git push
